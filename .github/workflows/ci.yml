name: CI
on:
  pull_request:
  push:
    branches: [main, 'feature/**', 'fix/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:extension
      - run: npm run check
      - run: npm test
