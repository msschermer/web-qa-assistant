name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:extension
      - run: npm run check
      - run: npm test
      - run: npm run release:validate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Package extension
        run: |
          cd dist/extension
          zip -qr ../../web-qa-assistant-extension-${GITHUB_REF_NAME#v}.zip .
      - name: Package source
        run: |
          zip -qr web-qa-assistant-full-${GITHUB_REF_NAME#v}.zip . \
            -x '.git/*' 'node_modules/*' '*.zip' '.env' '.env.local'
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "web-qa-assistant-extension-${GITHUB_REF_NAME#v}.zip" \
            "web-qa-assistant-full-${GITHUB_REF_NAME#v}.zip" \
            --generate-notes --title "Web QA Assistant $GITHUB_REF_NAME"
