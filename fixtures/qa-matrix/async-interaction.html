<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Async interaction matrix</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <h1>Async interaction matrix</h1>
  <p>Synthetic page for bounded settle and restoration checks.</p>

  <button type="button" id="sync-toggle" aria-expanded="false" aria-controls="sync-panel">Sync section</button>
  <div id="sync-panel" hidden>Sync panel</div>

  <button type="button" id="micro-toggle" aria-expanded="false" aria-controls="micro-panel">Microtask section</button>
  <div id="micro-panel" hidden>Microtask panel</div>

  <button type="button" id="raf-toggle" aria-expanded="false" aria-controls="raf-panel">Animation frame section</button>
  <div id="raf-panel" hidden>RAF panel</div>

  <button type="button" id="timeout-toggle" aria-expanded="false" aria-controls="timeout-panel">Short timeout section</button>
  <div id="timeout-panel" hidden>Timeout panel</div>

  <button type="button" id="late-toggle" aria-expanded="false" aria-controls="late-panel">Late timeout section</button>
  <div id="late-panel" hidden>Late panel</div>

  <button type="button" id="throw-toggle" aria-expanded="false" aria-controls="throw-panel">Throwing section</button>
  <div id="throw-panel" hidden>Throw panel</div>

  <button type="button" id="checkout-details" aria-expanded="false" aria-controls="checkout-panel">Open checkout details</button>
  <div id="checkout-panel" hidden>Must not activate</div>

  <button type="button" id="payment-options" aria-expanded="false" aria-controls="payment-panel">Show payment options</button>
  <div id="payment-panel" hidden>Must not activate</div>

  <button type="button" id="shipping-info" aria-expanded="false" aria-controls="shipping-panel">Expand shipping information</button>
  <div id="shipping-panel" hidden>Safe local disclosure</div>

  <button type="button" id="delete-faq" aria-expanded="false" aria-controls="delete-panel">Delete FAQ</button>
  <div id="delete-panel" hidden>Must not activate</div>

  <button type="button" id="safe-menu" aria-expanded="false" aria-controls="safe-menu-panel" aria-haspopup="menu">Account menu</button>
  <div id="safe-menu-panel" role="menu" hidden>
    <div role="menuitem">Profile settings</div>
    <div role="menuitem">Preferences</div>
  </div>

  <button type="button" id="unsafe-menu" aria-expanded="false" aria-controls="unsafe-menu-panel" aria-haspopup="menu">Nav menu</button>
  <div id="unsafe-menu-panel" role="menu" hidden>
    <a role="menuitem" href="https://example.com/logout">Log out</a>
  </div>

  <a class="skip-link" href="#main-content">Skip to main</a>
  <main id="main-content" tabindex="-1">Main content</main>

  <iframe id="async-frame" title="Async frame" width="400" height="200"
    srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset='utf-8'&gt;&lt;title&gt;Frame child&lt;/title&gt;&lt;/head&gt;&lt;body&gt;&lt;button type='button' id='frame-good' aria-expanded='false' aria-controls='frame-panel'&gt;Frame section&lt;/button&gt;&lt;div id='frame-panel' hidden&gt;Frame panel&lt;/div&gt;&lt;button type='button' id='frame-broken' aria-expanded='false' aria-controls='frame-broken-panel'&gt;Broken frame section&lt;/button&gt;&lt;div id='frame-broken-panel' hidden&gt;Broken&lt;/div&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
</body>
</html>
